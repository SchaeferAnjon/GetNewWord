<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26272C"/><stop offset="1" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C86E6"/><stop offset="1" stop-color="#5E6AD2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- macOS squircle-ish background (Apple masks it anyway) -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64.5" y="64.5" width="895" height="895" rx="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  <!-- viewfinder corners -->
  <g fill="none" stroke="url(#ac)" stroke-width="44" stroke-linecap="round" filter="url(#glow)">
    <path d="M232 372 V292 a60 60 0 0 1 60 -60 H372"/>
    <path d="M652 232 H732 a60 60 0 0 1 60 60 V372"/>
    <path d="M792 652 V732 a60 60 0 0 1 -60 60 H652"/>
    <path d="M372 792 H292 a60 60 0 0 1 -60 -60 V652"/>
  </g>
  <!-- glyph -->
  <text x="512" y="672" text-anchor="middle" font-family="Inter, SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="420" fill="#EDEDEF">A</text>
  <!-- accent underline: 'captured' -->
  <rect x="392" y="700" width="240" height="26" rx="13" fill="url(#ac)"/>
</svg>
